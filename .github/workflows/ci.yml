name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Format, lint and test
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: quarry
                    POSTGRES_PASSWORD: quarry
                    POSTGRES_DB: quarry
                ports:
                    - 5434:5432
                options: >-
                    --health-cmd "pg_isready -U quarry -d quarry"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # `npm ci` runs `prisma generate`, which reads DATABASE_URL; the API tests create `quarry_test` from it.
            DATABASE_URL: postgresql://quarry:quarry@localhost:5434/quarry
            WAREHOUSE_URL: postgresql://quarry:quarry@localhost:5434/warehouse
            BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
            BETTER_AUTH_URL: http://localhost:3000
            # The runner's Chrome can't start its sandbox on Ubuntu 24.04 (story screenshot and PDF tests).
            PUPPETEER_DISABLE_SANDBOX: '1'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: npm install -g npm@11.10.1
            - run: npm ci
            # The example warehouse (jaffle_shop) the SQL engine, agent and sync tests query
            - name: Load the example warehouse
              env:
                  PGPASSWORD: quarry
              run: |
                  psql -h localhost -p 5434 -U quarry -d quarry -c 'CREATE DATABASE warehouse'
                  psql -h localhost -p 5434 -U quarry -d warehouse -q -v ON_ERROR_STOP=1 -f docker/postgres/warehouse-example.sql
            - run: npm run format:check
            - run: npm run lint
            - run: npm test

    docker:
        name: Docker image
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
                      type=semver,pattern={{version}}
            # Pull requests only build the image; pushes to main and version tags publish it to GHCR.
            - if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VITE_QUARRY_REPOSITORY_URL=https://github.com/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
