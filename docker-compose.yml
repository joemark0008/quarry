# Local Postgres for quarry. One server, three databases:
#   quarry       app database (Prisma)
#   warehouse    test warehouse the agent queries (jaffle_shop, loaded by `npm run warehouse:load`)
#   nao_baseline upstream nao (../fork-reference) running as the comparison baseline
# Host port 5434, since 5432 is often taken by another local Postgres.
services:
    postgres:
        image: postgres:16-alpine
        container_name: quarry_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-quarry}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarry}
            POSTGRES_DB: quarry
        ports:
            - '${POSTGRES_PORT:-5434}:5432'
        volumes:
            - quarry_postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-quarry} -d warehouse']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    quarry_postgres_data:
